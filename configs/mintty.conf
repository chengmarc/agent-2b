# The app's terminal look (app.cmd passes this to mintty with -c, so it wins over ~/.minttyrc).
# No theme: warm near-black text on a warm near-white background.
ThemeFile=
ForegroundColour=46,38,30
BackgroundColour=250,246,238
CursorColour=46,38,30
# The agent's red, green and yellow: mintty's defaults are made for a dark background.
# Full saturation, dark enough to read on the warm white (contrast 4.5+).
Red=180,20,20
Green=0,125,40
Yellow=155,100,0
BoldRed=195,25,25
BoldGreen=0,135,45
BoldYellow=165,105,0
# Consolas comes with every Windows.
Font=Consolas
FontWeight=700
FontHeight=14
# Closing the window doesn't ask first ("processes are running"); a 2b in it still stops its server.
ConfirmExit=no
