# llama server settings, read each time 2b starts the server. Tuned for an 8 GB GPU (RTX 5060 Laptop)
# and 16 GB+ RAM; on a different GPU, edit by hand.
#   NCPUMOE   expert layers kept on the CPU, 0-24. Lower is faster but needs more VRAM;
#             raise it if the server fails to start (out of memory), lower it on a bigger GPU.
#   LOADMODE  none = copy CPU-side experts into RAM (fast, needs ~14 GB RAM); mmap = read them from disk
#   CTX       context window in tokens (more needs more VRAM: raise NCPUMOE with it)
NCPUMOE=17
LOADMODE=none
CTX=32768
